<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Master</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: auto;
            background: white;
            padding: 20px;
            border-radius: 12px;
        }

        h1 {
            text-align: center;
        }

        .question {
            margin-bottom: 20px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #333;
            color: white;
            font-size: 16px;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Quiz Master</h1>

    <form method="POST">

        <div class="question">
            <p><b>1. What is the capital of India?</b></p>

            <label>
                <input type="radio" name="q1" value="Delhi">
                Delhi
            </label><br>

            <label>
                <input type="radio" name="q1" value="Mumbai">
                Mumbai
            </label><br>

            <label>
                <input type="radio" name="q1" value="Chennai">
                Chennai
            </label><br>

            <label>
                <input type="radio" name="q1" value="Kolkata">
                Kolkata
            </label>
        </div>

        <button type="submit">Submit Exam</button>

    </form>

</div>

</body>
              </html>
